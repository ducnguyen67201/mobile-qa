name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
      web: ${{ steps.paths.outputs.web }}
      worker: ${{ steps.paths.outputs.worker }}
      contracts: ${{ steps.paths.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            contracts: &shared
              - 'crates/contracts/**'
              - 'contracts/**'
              - 'scripts/**'
              - 'justfile'
              - '.github/workflows/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'apps/web/openapi-ts.config.ts'
              - 'apps/web/src/api/generated/**'
              - 'apps/mobile-worker/src/mobile_qa_worker/generated/**'
              - '.node-version'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'apps/web/pnpm-workspace.yaml'
              - 'apps/web/package.json'
              - 'apps/web/pnpm-lock.yaml'
              - 'apps/mobile-worker/uv.lock'
              - 'apps/mobile-worker/pyproject.toml'
            api:
              - *shared
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'apps/api/**'
              - 'infra/**'
            web:
              - *shared
              - 'apps/web/**'
              - '.node-version'
            worker:
              - *shared
              - 'apps/mobile-worker/**'
  api:
    needs: scope
    if: needs.scope.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/runtime.py check-api
      - run: cargo build --workspace --locked
  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
  worker:
    needs: scope
    if: needs.scope.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
          enable-cache: true
          cache-dependency-glob: apps/mobile-worker/uv.lock
      - run: uv sync --project apps/mobile-worker --frozen
      - run: uv run --no-sync --project apps/mobile-worker --frozen ruff check apps/mobile-worker
      - run: cd apps/mobile-worker && uv run --no-sync --frozen pyright
      - run: uv run --no-sync --project apps/mobile-worker --frozen pytest apps/mobile-worker/tests
  contracts:
    needs: scope
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
          enable-cache: true
          cache-dependency-glob: apps/mobile-worker/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile --ignore-scripts
      - run: uv sync --project apps/mobile-worker --frozen
      - run: python3 scripts/contracts.py --check
      - run: python3 -m unittest scripts.test_contracts
