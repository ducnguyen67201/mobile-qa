# Select affected apps plus contract consumers; do not attach checks to local edits.
# PR selection covers the entire PR diff, so earlier changes do not lose coverage.
# These are file/package filters, not automatic per-function test dependency analysis.
name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Stop superseded PR work while allowing main-branch validation to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: pnpm --dir apps/web install --frozen-lockfile --ignore-scripts
      - run: uv sync --project apps/mobile-worker --frozen
      - run: python3 scripts/format.py --check
  scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
      web: ${{ steps.paths.outputs.web }}
      worker: ${{ steps.paths.outputs.worker }}
      contracts: ${{ steps.paths.outputs.contracts }}
      demo: ${{ steps.paths.outputs.demo }}
      scope_tests: ${{ steps.paths.outputs.scope_tests }}
      infra: ${{ steps.paths.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            demo:
              - '.github/workflows/**'
              - 'apps/qa-demo-android/**'
              - 'infra/device-host/toolchain.lock.json'
              - 'infra/device-host/install_tools.py'
              - 'scripts/local_device.py'
            scope_tests:
              - '.github/workflows/**'
              - 'scripts/test_ci_scope.py'
              - 'scripts/dev_stack.py'
              - 'scripts/test_dev_stack.py'
              - 'scripts/runtime.py'
            infra:
              - '.github/workflows/**'
              - 'infra/aws/**'
              - 'infra/deployment/**'
              - 'infra/device-host/ami/**'
              - 'infra/device-host/network/**'
              - 'infra/device-host/mobile-qa-host.service'
              - 'Dockerfile.api'
              - '.dockerignore'
              - 'railway.toml'
              - 'scripts/check_deployment.py'
              - 'scripts/test_check_deployment.py'
              - 'crates/contracts/src/device_hosts.rs'
              - 'crates/contracts/src/device_hosts_api.rs'
              - 'crates/contracts/src/artifacts_api.rs'
              - 'contracts/worker.schema.json'
            api:
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'apps/api/**'
              - 'crates/contracts/**'
              - 'contracts/fixtures/**'
              - 'infra/compose.yaml'
              - 'infra/postgres/**'
              - 'scripts/runtime.py'
              - 'scripts/setup_android.py'
              - 'scripts/apk_fixtures.py'
              - 'scripts/app_setup_smoke.py'
              - 'scripts/execution_smoke.py'
              - 'scripts/test_library_smoke.py'
              - 'scripts/direct_authoring_smoke.py'
              - 'scripts/minitap_discovery_smoke.py'
              - 'scripts/task_session_smoke.py'
            web:
              - '.github/workflows/**'
              - 'apps/web/**'
              - '.node-version'
              - 'crates/contracts/src/browser.rs'
              - 'crates/contracts/src/artifacts_api.rs'
              - 'crates/contracts/src/execution.rs'
              - 'crates/contracts/src/execution_api.rs'
              - 'crates/contracts/src/test_library.rs'
              - 'crates/contracts/src/test_library_api.rs'
              - 'crates/contracts/src/task_sessions.rs'
              - 'crates/contracts/src/automation.rs'
              - 'crates/contracts/src/automation_api.rs'
              - 'crates/contracts/src/task_sessions_api.rs'
              - 'contracts/browser.openapi.json'
              - 'crates/contracts/Cargo.toml'
              - 'crates/contracts/src/lib.rs'
            worker:
              - '.github/workflows/**'
              - 'apps/mobile-worker/**'
              - 'crates/contracts/src/worker.rs'
              - 'crates/contracts/src/device_hosts.rs'
              - 'crates/contracts/src/artifacts_api.rs'
              - 'crates/contracts/src/execution.rs'
              - 'crates/contracts/src/task_sessions.rs'
              - 'crates/contracts/src/automation.rs'
              - 'crates/contracts/src/automation_api.rs'
              - 'scripts/execution_smoke.py'
              - 'scripts/test_library_smoke.py'
              - 'scripts/direct_authoring_smoke.py'
              - 'scripts/minitap_discovery_smoke.py'
              - 'scripts/task_session_smoke.py'
              - 'crates/contracts/src/worker/**'
              - 'infra/device-host/**'
              - 'contracts/worker.schema.json'
              - 'contracts/fixtures/**'
              - 'scripts/sdk_smoke.py'
              - 'scripts/local_device.py'
              - 'crates/contracts/Cargo.toml'
              - 'crates/contracts/src/lib.rs'
            # Generator inputs and generated-only edits still need drift validation.
            # This does not imply every app suite depends on every generator dependency.
            contracts:
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'crates/contracts/**'
              - 'contracts/browser.openapi.json'
              - 'contracts/worker.schema.json'
              - 'contracts/fixtures/**'
              - 'apps/web/src/api/generated/**'
              - 'apps/mobile-worker/src/mobile_qa_worker/generated/**'
              - 'scripts/contracts.py'
              - 'scripts/test_contracts.py'
              - 'apps/web/openapi-ts.config.ts'
              - 'apps/web/package.json'
              - 'apps/web/pnpm-lock.yaml'
              - 'apps/web/pnpm-workspace.yaml'
              - '.node-version'
              - 'apps/mobile-worker/pyproject.toml'
              - 'apps/mobile-worker/uv.lock'
              - 'apps/mobile-worker/.python-version'
  api:
    needs: scope
    if: needs.scope.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: python3 scripts/setup_android.py
      - run: python3 scripts/apk_fixtures.py
      - run: python3 scripts/runtime.py check-api --api-only
      - run: cargo build --package mobile-qa --locked
      - run: python3 scripts/app_setup_smoke.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
      - run: uv sync --project apps/mobile-worker --frozen
      - run: python3 scripts/execution_smoke.py
      - run: python3 scripts/test_library_smoke.py
      - run: python3 scripts/direct_authoring_smoke.py
  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir apps/web format:check
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
  worker:
    needs: scope
    if: needs.scope.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
          enable-cache: true
          cache-dependency-glob: apps/mobile-worker/uv.lock
      - run: uv sync --project apps/mobile-worker --frozen --extra sdk --extra device --extra ai
      - run: uv run --no-sync --project apps/mobile-worker --frozen ruff check apps/mobile-worker
      - run: cd apps/mobile-worker && uv run --no-sync --frozen pyright
      - run: uv run --no-sync --project apps/mobile-worker --frozen pytest apps/mobile-worker/tests
  # The pure contract job needs generators, but no PostgreSQL or device/model access.
  contracts:
    needs: scope
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
          enable-cache: true
          cache-dependency-glob: apps/mobile-worker/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile --ignore-scripts
      - run: uv sync --project apps/mobile-worker --frozen
      - run: cargo fmt --package mobile-qa-contracts -- --check
      - run: cargo clippy --package mobile-qa-contracts --all-targets --locked -- -D warnings
      - run: cargo test --package mobile-qa-contracts --locked
      - run: python3 scripts/contracts.py --check
      - run: python3 -m unittest scripts.test_contracts

  # Offline provider/device fakes only. No AWS identity, plan, apply or paid image build.
  infra:
    needs: scope
    if: needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - uses: hashicorp/setup-packer@c4e4b2636b98ce7566f9ec9c309e26821f695bd2
        with:
          version: 1.16.1
      - run: uv sync --project infra/aws/capacity-controller --frozen
      - run: uv run --project infra/aws/capacity-controller --frozen ruff check infra/aws/capacity-controller
      - run: cd infra/aws/capacity-controller && uv run --frozen pyright
      - run: cd infra/aws/capacity-controller && uv run --frozen pytest
      - run: python3 -m unittest scripts.test_check_deployment
      - run: python3 scripts/check_deployment.py
      # Package builds catch missing compile-time assets and runtime dependencies.
      # These images stay on the runner; no registry push or cloud deployment.
      - run: docker build --platform linux/amd64 --provenance=false -f Dockerfile.api -t mobile-qa-api:check .
      - run: docker build --platform linux/amd64 --provenance=false -f infra/aws/capacity-controller/Dockerfile -t mobile-qa-capacity:check .

  demo:
    needs: scope
    if: needs.scope.outputs.demo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            .private/android-sdk
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: demo-${{ runner.os }}-${{ hashFiles('infra/device-host/toolchain.lock.json', 'apps/qa-demo-android/**/*.gradle', 'apps/qa-demo-android/gradle/wrapper/*') }}
      - run: python3 infra/device-host/install_tools.py --sdk-root "$GITHUB_WORKSPACE/.private/android-sdk" --demo-only
      - name: Build and lint controlled APKs only
        run: |
          # Hosted runners predefine a different SDK through this deprecated alias.
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME="$GITHUB_WORKSPACE/.private/android-sdk"
          cd apps/qa-demo-android
          ./gradlew --no-daemon :app:assembleGoodDebug :app:assembleBrokenDebug :app:assembleSampleDebug :app:lintGoodDebug :app:lintBrokenDebug :app:lintSampleDebug
  scope_tests:
    needs: scope
    if: needs.scope.outputs.scope_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm --dir apps/web install --frozen-lockfile --ignore-scripts
      - run: uv sync --project apps/mobile-worker --frozen
      - run: uv run --no-sync --project apps/mobile-worker --frozen python scripts/test_ci_scope.py
      - run: python3 -m unittest scripts.test_dev_stack
