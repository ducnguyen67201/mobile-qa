name: Refresh codebase graph

on:
  push:
    branches: [main]
    # A generated commit must never start another refresh, even with a future app token.
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphify-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GRAPHIFY_QUERY_LOG_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued runs index current main, not an older triggering commit.
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
          enable-cache: true
          cache-dependency-glob: tools/graphify/uv.lock
      - name: Generate code graph and report without model access
        run: python3 scripts/refresh_graphify.py
      - name: Commit only generated navigation files
        run: |
          git add -- graphify-out/graph.json graphify-out/GRAPH_REPORT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: refresh codebase graph'
      - name: Publish only if indexed main is still current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Credentials are available only for publication, never persisted in checkout.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            exit 0
          fi
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main advanced during generation; the next queued run will rebuild.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # No force/rebase: a racing source merge must reject this stale graph commit.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/main
