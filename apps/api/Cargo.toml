[package]
name = "mobile-qa"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "mobile-qa-cli"
[dependencies]
loco-rs = { workspace = true }
mobile-qa-contracts = { path = "../../crates/contracts" }
migration = { path = "migration" }
async-trait = "0.1"
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
[[bin]]
name = "mobile-qa-cli"
path = "src/bin/main.rs"
