# Future deployment configuration, not proof that a production service exists.
# HOST and DATABASE_URL come from Doppler process injection; PORT is a platform setting.
# Relative web asset paths assume the API process runs from apps/api.
logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: json
server:
  port: <%= get_env(name="PORT") %>
  binding: 0.0.0.0
  host: <%= get_env(name="HOST") %>
  middlewares:
    fallback:
      enable: false
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: '/'
        path: '../web/dist'
      fallback: '../web/dist/index.html'
database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  connect_timeout: 10000
  idle_timeout: 10000
  min_connections: 1
  max_connections: 4
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
