[project]
name = "mobile-qa-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.11,<3"]
[project.optional-dependencies]
sdk = ["minitap-mobile-use==4.0.0"]
[dependency-groups]
dev = [
    "datamodel-code-generator==0.76.0",
    "ruff==0.12.10",
    "pyright==1.1.405",
    "pytest==9.0.3",
]
[project.scripts]
mobile-qa-worker = "mobile_qa_worker.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mobile_qa_worker"]
[tool.ruff]
line-length = 100
extend-exclude = ["src/mobile_qa_worker/generated"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pyright]
typeCheckingMode = "strict"
include = ["src/mobile_qa_worker"]
exclude = ["src/mobile_qa_worker/generated"]
venvPath = "."
venv = ".venv"
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Minitap 4.0.0 pins an affected dotenv release. Keep the patched compatible
# version until upstream relaxes its pin (CVE-2026-28684).
override-dependencies = ["python-dotenv==1.2.2"]
