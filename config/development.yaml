logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: compact
server:
  port: 5150
  binding: 127.0.0.1
  host: http://127.0.0.1:5150
  middlewares:
    fallback:
      enable: false
    static:
      enable: false
      must_exist: true
      precompressed: false
      folder:
        uri: "/"
        path: "frontend/dist"
      fallback: "frontend/dist/index.html"
database:
  uri: postgres://mobile_qa:mobile_qa_local@127.0.0.1:55432/mobile_qa_development
  enable_logging: false
  connect_timeout: 10000
  idle_timeout: 10000
  min_connections: 1
  max_connections: 4
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
