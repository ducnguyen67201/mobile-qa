logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: json
server:
  port: 5150
  binding: 127.0.0.1
  host: <%= get_env(name="HOST") %>
  middlewares:
    fallback:
      enable: false
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/"
        path: "frontend/dist"
      fallback: "frontend/dist/index.html"
database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  connect_timeout: 10000
  idle_timeout: 10000
  min_connections: 1
  max_connections: 4
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
