[project]
name = "mobile-qa-capacity-controller"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["boto3==1.43.99", "pydantic>=2.11,<3"]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.12.10", "pyright==1.1.405", "boto3-stubs-lite[ec2,secretsmanager]==1.43.99"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "../../../apps/mobile-worker/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["capacity_controller"]
extraPaths = ["../../../apps/mobile-worker/src"]
venvPath = "."
venv = ".venv"
