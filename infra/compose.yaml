# Local development/test PostgreSQL only. Never use these public fixture credentials
# for a deployed database. Bind loopback and preserve the volume across dev sessions.
name: mobile-qa-local
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: mobile_qa
      POSTGRES_PASSWORD: mobile_qa_local
      POSTGRES_DB: mobile_qa_development
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobile_qa -d mobile_qa_development"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
