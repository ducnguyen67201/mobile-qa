# Copy into operator-private configuration and supply an approved model ID.
# These are dedicated Linux host paths, not macOS developer defaults.
sdk_root = "/opt/mobile-qa/android-sdk"
state_root = "/var/lib/mobile-qa/device"
toolchain = "/opt/mobile-qa/repo/infra/device-host/toolchain.lock.json"
model = "REQUIRED_APPROVED_MODEL_ID"
doppler_project = "mobile-qa"
doppler_config = "dev"
boot_seconds = 180
command_seconds = 20
install_seconds = 90
init_seconds = 60
navigation_seconds = 180
cleanup_seconds = 240
assertion_seconds = 15
max_steps = 30
